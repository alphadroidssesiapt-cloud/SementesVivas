<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sementes Vivas</title>
    <style>
        /* Estilos básicos para o site */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f5;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Cabeçalho */
        header {
            background-color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .header-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Contentores das Telas */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }
        .view {
            display: none; 
        }
        .view.active {
            display: block; 
        }

        /* Cartões do Dashboard */
        .cards-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            flex: 1;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0;
            transition: 0.3s;
        }
        .card:hover {
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            transform: translateY(-5px);
        }
        .card h3 {
            color: #2c4c3b;
            margin-top: 15px;
        }
        .card-icon {
            font-size: 40px;
        }

        /* Formulários e Botões */
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        
        /* Estilização personalizada para o botão da câmara */
        .camera-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            margin: 10px 0 20px 0;
        }
        .camera-btn {
            background-color: #f0f0f0;
            border: 2px dashed #2c4c3b;
            color: #2c4c3b;
            padding: 20px;
            text-align: center;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        .camera-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
        }

        button.btn-primary {
            background-color: #2c4c3b;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button.btn-primary:hover {
            background-color: #1e3629;
        }
        button.btn-primary:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        /* Grelha de Sementes */
        #seeds-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .seed-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .seed-box img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO SUPERIOR (Sem o menu de navegação) -->
    <header>
        <div>
            <h2 style="margin: 0; color: #1e3629; cursor: pointer;" onclick="window.showDashboard()">🌱 Sementes Vivas</h2>
        </div>
        <div class="header-user">
            <span id="user-greeting">Olá, utilizador</span>
            <button onclick="window.logout()" style="padding: 5px 10px; font-size: 14px; background: transparent; border: 1px solid #2c4c3b; color: #2c4c3b; cursor: pointer; border-radius: 4px;">Sair 🚪</button>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <div class="container">
        
        <!-- TELA DO PAINEL PRINCIPAL -->
        <div id="dashboard-view" class="view active">
            <h2 style="color: #1e3629;">O que deseja fazer hoje?</h2>
            <div class="cards-container">
                <div class="card" onclick="window.showAvailable()">
                    <div class="card-icon">📦</div>
                    <h3>Sementes Disponíveis</h3>
                </div>
                <div class="card" onclick="window.showDonate()">
                    <div class="card-icon">📸</div>
                    <h3>Doar Sementes</h3>
                </div>
                <div class="card" onclick="window.showLearn()">
                    <div class="card-icon">📖</div>
                    <h3>Aprender a Plantar</h3>
                </div>
            </div>
        </div>

        <!-- TELA DE DOAR SEMENTE (Câmara Obrigatória) -->
        <div id="donate-view" class="view">
            <h2 style="color: #1e3629;">Cadastrar Nova Semente</h2>
            <button onclick="window.showDashboard()" style="margin-bottom: 20px; background: none; border: none; color: #2c4c3b; cursor: pointer; text-decoration: underline; padding: 0;">⬅ Voltar ao Início</button>
            
            <div style="background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px;">
                <label style="font-weight: bold; color: #333;">Nome da Semente:</label>
                <input type="text" id="donate-seed-name" placeholder="Ex: Girassol, Feijão, Milho...">
                
                <label style="font-weight: bold; color: #333; display: block; margin-top: 10px;">Fotografar Semente:</label>
                
                <!-- O capture="environment" obriga a usar a câmara e bloqueia o upload de ficheiros no telemóvel -->
                <div class="camera-btn-wrapper">
                    <div class="camera-btn" id="camera-label">📷 Clique aqui para tirar a foto</div>
                    <input type="file" id="donate-seed-photo" accept="image/*" capture="environment" onchange="document.getElementById('camera-label').innerText = '✅ Foto tirada com sucesso!'">
                </div>
                
                <button id="btn-donate" class="btn-primary" onclick="window.processDonation()">Salvar no Banco de Dados</button>
                <p id="upload-loading" style="display: none; color: #d68100; margin-top: 15px; text-align: center; font-weight: bold;">A guardar semente e foto no Firebase... aguarde.</p>
            </div>
        </div>

        <!-- TELA DE SEMENTES DISPONÍVEIS -->
        <div id="available-view" class="view">
            <h2 style="color: #1e3629;">Sementes Doadas pela Comunidade</h2>
            <button onclick="window.showDashboard()" style="margin-bottom: 20px; background: none; border: none; color: #2c4c3b; cursor: pointer; text-decoration: underline; padding: 0;">⬅ Voltar ao Início</button>
            
            <div id="seeds-grid-container">
                <!-- As sementes vão aparecer aqui dinamicamente -->
            </div>
        </div>

    </div>

    <!-- CARREGAR O SEU JAVASCRIPT -->
    <script type="module" src="script.js"></script>
</body>
</html>
